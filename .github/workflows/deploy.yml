name: Deploy to Vercel

on:
  push:
    branches:
      - claude/create-planning-prd-wdoZK
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Verify Vercel token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions/new"
            exit 1
          fi

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Deploy (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          AUTH_SECRET="${{ secrets.AUTH_SECRET }}"
          if [ -z "$AUTH_SECRET" ]; then
            AUTH_SECRET="$(openssl rand -hex 32)"
          fi
          echo "::add-mask::$AUTH_SECRET"

          # 첫 배포 시 프로젝트 자동 생성
          set +e
          OUT=$(vercel deploy \
            --prod \
            --yes \
            --token="$VERCEL_TOKEN" \
            --name=catchpass \
            --env AUTH_SECRET="$AUTH_SECRET" \
            --build-env AUTH_SECRET="$AUTH_SECRET" \
            2>&1)
          RC=$?
          set -e
          echo "$OUT"
          # 마지막에 URL 라인이 나옴
          URL=$(echo "$OUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -1)
          if [ -z "$URL" ]; then
            echo "❌ URL 추출 실패 (vercel exit=$RC)"
            exit 1
          fi
          echo "DEPLOY_URL=$URL" >> "$GITHUB_ENV"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

          {
            echo "## ✅ Vercel Deployed"
            echo ""
            echo "**Production URL:** $URL"
            echo ""
            echo "### 입구"
            echo "- 랜딩: ${URL}/"
            echo "- 체험자 로그인: ${URL}/r/login"
            echo "- 사장님 로그인: ${URL}/o/login"
            echo ""
            echo "### 데모 계정"
            echo "- 체험자: demo@reviewer.com / demo1234"
            echo "- 사장님: demo@store.com / demo1234"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          echo "Smoke testing $URL"
          sleep 5
          for path in / /r/login /o/login; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL$path")
            echo "$path → $code"
            test "$code" = "200" || { echo "FAIL $path"; exit 1; }
          done

          R=/tmp/r.txt; O=/tmp/o.txt
          curl -sS -c $R -X POST -H 'Content-Type: application/json' "$URL/api/auth/login" \
            -d '{"role":"reviewer","email":"demo@reviewer.com","password":"demo1234"}' | tee /tmp/r-login.json
          grep -q '"ok":true' /tmp/r-login.json

          curl -sS -c $O -X POST -H 'Content-Type: application/json' "$URL/api/auth/login" \
            -d '{"role":"owner","email":"demo@store.com","password":"demo1234"}' | tee /tmp/o-login.json
          grep -q '"ok":true' /tmp/o-login.json

          echo "✓ smoke ok"

      - name: Write deploy URL back to repo
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -e
          echo "$URL" > .deploy-url
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-url
          git diff --cached --quiet || git commit -m "deploy: $URL [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
